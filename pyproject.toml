[project]
name = "ddn"
version = "0.1.0"
description = "Document Delivery Network: the operation, planned on the vrp platform"
requires-python = ">=3.13"
# The platform is a dependency, not a copy. DDN is downstream of `vrp` and of
# the OSRM gateway; neither knows DDN exists, and nothing here may ask them to.
# `[pyvrp]` because DDN solves: the adapter imports pyvrp at module level.
dependencies = [
    "vrp-platform[pyvrp] @ git+https://github.com/lvalverdeb/osrm-microservice@v0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddn"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
