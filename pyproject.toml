[project]
name = "ddn"
version = "0.1.0"
description = "Document Delivery Network: the operation, planned on the vrp platform"
requires-python = ">=3.13"
# The platform is a dependency, not a copy. DDN is downstream of `vrp` and of
# the OSRM gateway; neither knows DDN exists, and nothing here may ask them to.
# `[pyvrp]` because DDN solves: the adapter imports pyvrp at module level.
dependencies = [
    "vrp-platform[pyvrp] @ git+https://github.com/lvalverdeb/osrm-microservice@v0.4.0",
]

[project.optional-dependencies]
# §13's service layer. FastAPI because the spec names it; Arq because §13.1
# rules out in-process background tasks and asks for "a dedicated queue with
# retry and visibility" -- Arq is asyncio-native, so it needs no thread bridge
# from an async handler, and its job records are the status endpoint's source.
api = [
    "fastapi>=0.115",
    "arq>=0.26",
]
# For opening the notebooks in `notebooks/`. Not needed to run them in the
# suite -- `nbclient` and `ipykernel` below do that -- so nobody installs a
# lab to run the tests.
notebooks = [
    "jupyterlab>=4.3",
]
dev = [
    "pytest>=8.0.0",
    # So `tests/test_notebooks.py` can execute every notebook. A notebook that
    # is not run is documentation that agrees with itself.
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "pytest-asyncio>=0.24",
    "ruff==0.16.4",
    # So the suite still needs no external service. CLAUDE.md's commands
    # promise tests that run without a gateway or routing data; a Redis
    # requirement would break that promise for everyone who clones this.
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The platform is pinned by git tag rather than fetched from an index, and
# hatchling refuses a direct reference unless told that is deliberate. It is:
# there is no package index this repository could pull `vrp-platform` from.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ddn"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
