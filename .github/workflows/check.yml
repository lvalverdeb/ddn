# `make check` — ruff, then the suite.
#
# Four steps, because the suite needs nothing: no gateway, no Redis, no routing
# data, and no credentials. `vrp-platform` is pinned from a public repository,
# so `uv sync` clones it anonymously.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first. The suite takes seconds, but a queue of
# runs for superseded commits tells nobody anything.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # pyvrp compiles and the platform is fetched from git rather than an
          # index, so a cold resolve is the slowest thing here by far.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: make check
        env:
          # Refuse to update uv.lock. Locally `make install` may resolve freely;
          # here a pyproject change that nobody locked should fail rather than
          # be silently resolved into a build no one else can reproduce.
          UV_FROZEN: "1"
        run: make check
