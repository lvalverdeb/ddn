# Bootstrap: `make bootstrap`.
#
# Everything configurable is an environment variable, and compose reads `.env`
# from this directory without being told to. `.env.example` lists them;
# `make config` prints what is in force.
#
# Two processes and a queue, which is what §13 needs. The API accepts requests
# and enqueues; the worker runs the jobs; Redis is between them. §13.1 rules
# out running solver work inside the request, so the worker is a separate
# container rather than a thread -- a process that dies takes in-process work
# with it, and nobody can ask what became of it.

name: ddn

# The api and the worker are the same image doing different jobs, so the build
# is written once. Two build blocks would drift, and the symptom would be a job
# that stays queued for ever because the worker cannot load it.
x-image: &image
  image: ${DDN_IMAGE:-ddn-api:latest}
  build:
    context: .
    secrets: [gh_token]
    ssh: [default]
  environment:
    DDN_REDIS_DSN: redis://redis:6379/0
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    # Appendonly so a restart does not silently drop queued jobs. §13.1 asks
    # for "retry and visibility"; a queue that forgets has neither.
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *image
    ports:
      - "${DDN_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    <<: *image
    command: ["arq", "ddn.api.jobs.WorkerSettings"]

volumes:
  redis-data:

secrets:
  gh_token:
    # Read access to lvalverdeb/osrm-microservice. Without it -- or an
    # ssh-agent -- `uv sync` fails during the build with a git authentication
    # error that names no repository.
    environment: GH_TOKEN
